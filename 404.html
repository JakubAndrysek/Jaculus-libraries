<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaculus Libraries Registry</title>

    <!-- Tailwind v4 Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Optional: small custom theme color (for accent) -->
    <style type="text/tailwindcss">
      @theme {
        --color-jaculus: #2563eb;
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <script>
      // --- BASIC CONFIG ------------------------------------------------------
      // Adjust only these if you fork / rename:
      window.SITE_CONFIG = {
        apiRepoOwner: "JakubAndrysek",
        apiRepoName: "Jaculus-libraries",
        registryBranch: "registry",
      };

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      async function viewFile(downloadUrl, fileName) {
        try {
          const response = await fetch(downloadUrl);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status} ${response.statusText}`);
          }

          const content = await response.text();

          document.body.innerHTML = `
            <div class="min-h-screen flex items-start justify-center bg-slate-900 py-6 px-4">
              <div class="w-full max-w-4xl bg-slate-800 shadow rounded-2xl border border-slate-700 p-5 md:p-6">
                <div class="flex items-center justify-between gap-4 mb-4">
                  <div>
                    <div class="inline-flex items-center gap-2 text-xs font-medium text-jaculus bg-jaculus/10 px-2.5 py-1 rounded-full">
                      <span class="w-1.5 h-1.5 rounded-full bg-jaculus"></span>
                      Registry
                    </div>
                    <h1 class="mt-2 text-lg md:text-xl font-semibold tracking-tight">
                      Jaculus Libraries
                    </h1>
                    <p class="text-xs text-slate-300 mt-1">
                      Viewing file <span class="font-semibold text-slate-100">${escapeHtml(
                        fileName
                      )}</span>
                    </p>
                  </div>
                  <button
                    onclick="window.location.reload()"
                    class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-200 border border-slate-700 rounded-full px-3 py-1.5 hover:bg-slate-700"
                  >
                    <span class="text-base">←</span>
                    Back
                  </button>
                </div>

                <div class="mt-4 rounded-xl bg-slate-900 text-slate-100 text-xs md:text-sm font-mono p-4 overflow-auto max-h-[70vh] border border-slate-800">
                  <pre class="whitespace-pre-wrap">${escapeHtml(content)}</pre>
                </div>
              </div>
            </div>
          `;
        } catch (error) {
          document.body.innerHTML = `
            <div class="min-h-screen flex items-center justify-center bg-slate-900 py-6 px-4">
              <div class="w-full max-w-xl bg-slate-800 shadow rounded-2xl border border-rose-700 p-5 md:p-6">
                <h2 class="text-base md:text-lg font-semibold text-rose-700 mb-2">
                  Error loading file
                </h2>
                <p class="text-sm text-rose-600">
                  ${escapeHtml(error.message)}
                </p>
                <button
                  onclick="window.location.reload()"
                  class="mt-4 inline-flex items-center gap-1.5 text-xs font-medium text-rose-700 border border-rose-200 rounded-full px-3 py-1.5 hover:bg-rose-50"
                >
                  Try again
                </button>
              </div>
            </div>
          `;
        }
      }

      (async () => {
        const cfg = window.SITE_CONFIG || {};
        const { apiRepoOwner, apiRepoName, registryBranch = "registry" } = cfg;

        if (!apiRepoOwner || !apiRepoName) {
          document.body.innerHTML = `
            <div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
              <div class="w-full max-w-xl bg-slate-800 shadow rounded-2xl border border-amber-700 p-5 md:p-6">
                <h2 class="text-base md:text-lg font-semibold text-amber-300 mb-2">
                  Configuration required
                </h2>
                <p class="text-sm text-amber-300">
                  Please set <code class="bg-slate-700 px-1.5 py-0.5 rounded text-xs">apiRepoOwner</code>
                  and <code class="bg-slate-700 px-1.5 py-0.5 rounded text-xs">apiRepoName</code> in
                  <code class="bg-slate-700 px-1.5 py-0.5 rounded text-xs">window.SITE_CONFIG</code>.
                </p>
              </div>
            </div>
          `;
          return;
        }

        // Base URL & site base path inferred from current location
        const host = window.location.hostname;
        const pathname = window.location.pathname || "/";
        const segments = pathname.split("/").filter(Boolean);
        let siteBasePath = "";
        let baseUrl = window.location.origin + "/";

        if (host.endsWith(".github.io") && segments.length > 0) {
          const repo = segments[0];
          siteBasePath = `/${repo}`;
          baseUrl = `${window.location.origin}${siteBasePath}/`;
        } else if (segments.length > 0) {
          siteBasePath = `/${segments[0]}`;
          baseUrl = `${window.location.origin}${siteBasePath}/`;
        }

        const apiContentsUrl = `https://api.github.com/repos/${apiRepoOwner}/${apiRepoName}/contents`;

        // Current path inside the repo
        let currentPath = window.location.pathname
          .replace(siteBasePath, "")
          .replace(/^\/+|\/+$/g, "");
        const apiPath = currentPath ? `/${currentPath}` : "";

        try {
          let fetchUrl = `${apiContentsUrl}${apiPath}?ref=${encodeURIComponent(
            registryBranch
          )}`;
          const response = await fetch(fetchUrl);
          const data = await response.json();

          if (!response.ok) {
            const message = data && data.message ? data.message : "Unknown error";
            throw new Error(`${response.status} ${response.statusText}: ${message}`);
          }

          // If single file -> show file
          if (!Array.isArray(data) && data && data.type === "file") {
            viewFile(data.download_url, data.name);
            return;
          }

          if (!Array.isArray(data)) {
            throw new Error("Unexpected API response format");
          }

          const prettyPath = `/${currentPath || ""}`;

          let listItems = "";

          // Parent directory entry
          if (currentPath) {
            const parentPath = currentPath.split("/").slice(0, -1).join("/");
            const parentUrl = parentPath ? `${siteBasePath}/${parentPath}/` : `${siteBasePath}/`;
            listItems += `
              <li class="flex items-center justify-between py-2.5 px-3 text-sm">
                <div class="flex items-center gap-2">
                  <span class="text-slate-400">↑</span>
                  <a href="${parentUrl}" class="text-slate-700 hover:text-jaculus font-medium">
                    .. (parent directory)
                  </a>
                </div>
                <span class="text-xs text-slate-400">Up</span>
              </li>
            `;
          }

          // Files and dirs
          for (const file of data) {
            const isDir = file.type === "dir";
            const displayName = isDir ? `${file.name}/` : file.name;
            const icon = isDir ? "📁" : "📄";

            if (isDir) {
              const dirUrl = `${baseUrl}${file.path}/`;
              listItems += `
                <li class="flex items-center justify-between py-2.5 px-3 text-sm">
                  <div class="flex items-center gap-2">
                    <span>${icon}</span>
                    <a href="${dirUrl}" class="text-slate-800 hover:text-jaculus font-medium">
                      ${escapeHtml(displayName)}
                    </a>
                  </div>
                  <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">
                    Directory
                  </span>
                </li>
              `;
            } else {
              const fileUrl = `${baseUrl}${file.path}`;
              listItems += `
                <li class="flex items-center justify-between py-2.5 px-3 text-sm">
                  <div class="flex items-center gap-2">
                    <span>${icon}</span>
                    <a href="${fileUrl}" class="text-slate-800 hover:text-jaculus font-medium">
                      ${escapeHtml(displayName)}
                    </a>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">
                      File
                    </span>
                    <a
                      href="#"
                      onclick="viewFile('${file.download_url}', '${escapeHtml(
                        file.name
                      )}'); return false;"
                      class="text-[11px] font-medium text-jaculus border border-jaculus/40 rounded-full px-2.5 py-0.5 hover:bg-jaculus/5"
                    >
                      View inline
                    </a>
                  </div>
                </li>
              `;
            }
          }

          if (!listItems) {
            listItems = `
              <li class="py-6 px-4 text-sm text-slate-400 text-center">
                This directory is empty.
              </li>
            `;
          }

          document.body.innerHTML = `
            <div class="min-h-screen flex items-start justify-center bg-slate-900 py-6 px-4">
              <div class="w-full max-w-4xl bg-slate-800 shadow rounded-2xl border border-slate-700 p-5 md:p-6">
                <div class="flex items-center justify-between gap-4">
                  <div>
                    <div class="inline-flex items-center gap-2 text-xs font-medium text-jaculus bg-jaculus/10 px-2.5 py-1 rounded-full">
                      <span class="w-1.5 h-1.5 rounded-full bg-jaculus"></span>
                      Registry
                    </div>
                    <h1 class="mt-2 text-lg md:text-xl font-semibold tracking-tight">
                      Jaculus Libraries
                    </h1>
                    <p class="text-xs text-slate-300 mt-1">
                      Branch <span class="font-semibold text-slate-100">${escapeHtml(
                        registryBranch
                      )}</span>
                    </p>
                  </div>
                </div>

                <div class="mt-4 inline-flex items-center gap-2 text-xs text-slate-300 bg-slate-700 px-3 py-1.5 rounded-full">
                  <span class="uppercase tracking-wide text-[10px] text-slate-400">Path</span>
                  <code class="text-[11px] text-slate-100">${escapeHtml(prettyPath)}</code>
                </div>

                <ul class="mt-4 border border-slate-700 rounded-xl divide-y divide-slate-700 bg-slate-800/60">
                  ${listItems}
                </ul>
              </div>
            </div>
          `;
        } catch (error) {
          document.body.innerHTML = `
            <div class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
              <div class="w-full max-w-xl bg-slate-800 shadow rounded-2xl border border-rose-700 p-5 md:p-6">
                <h2 class="text-base md:text-lg font-semibold text-rose-300 mb-2">
                  Error
                </h2>
                <p class="text-sm text-rose-300">
                  Failed to load content: ${escapeHtml(error.message)}
                </p>
              </div>
            </div>
          `;
        }
      })();
    </script>
  </body>
</html>
